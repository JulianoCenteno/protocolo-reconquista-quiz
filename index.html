<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protocolo de la Reconquista — Misión</title>
<meta name="description" content="Descubre tu Protocolo de la Reconquista personalizado.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<!--
  ⚙️ PIXELS / UTMIFY: cola aquí tus scripts de Facebook Pixel y UTMify
  (los mismos que ya usas). El quiz dispara eventos automáticamente:
  fbq('trackCustom','QuizStep',{step}) en cada etapa y
  fbq('track','InitiateCheckout') al hacer clic en el checkout.
-->
<style>
:root{
  --bg:#09090b; --bg2:#111114; --card:#16161a; --line:#26262c;
  --txt:#fafafa; --mute:#a1a1aa; --dim:#71717a;
  --red:#ef4444; --red2:#dc2626; --redglow:rgba(239,68,68,.35);
  --gold:#fbbf24; --gold2:#f59e0b;
  --green:#22c55e; --green2:#16a34a; --green3:#15803d;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
body{min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(600px 400px at 50% -120px,rgba(239,68,68,.18),transparent 70%),
             radial-gradient(500px 300px at 100% 110%,rgba(251,191,36,.06),transparent 70%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{max-width:100%;display:block}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 16px 48px}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:20;padding:12px 0 10px;background:linear-gradient(var(--bg) 70%,transparent)}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:"Bricolage Grotesque",Inter,sans-serif;font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.brand img{width:30px;height:30px;border-radius:8px;object-fit:cover}
.brand .dot{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--red),#7f1d1d);display:grid;place-items:center;font-size:15px}
.chips{display:flex;gap:6px;align-items:center}
.chip{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:700;white-space:nowrap}
.chip.xp{color:var(--gold);border-color:rgba(251,191,36,.35)}
.chip.xp.bump{animation:bump .5s}
.mute{width:30px;height:30px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;display:grid;place-items:center}
.map{display:flex;align-items:center;margin-top:12px;gap:0}
.node{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--card);border:2px solid var(--line);color:var(--dim);transition:.35s}
.node.done{background:var(--red);border-color:var(--red);color:#fff}
.node.now{border-color:var(--red);color:#fff;box-shadow:0 0 0 4px var(--redglow);animation:pulse 1.6s infinite}
.node.chest{font-size:13px}
.link{flex:1;height:4px;background:var(--line);position:relative;overflow:hidden}
.link i{position:absolute;inset:0;width:0;background:var(--red);transition:width .5s}
.hud.hide{display:none}

/* ---------- Screens ---------- */
.screen{display:none;padding-top:14px;animation:in .8s cubic-bezier(.2,.8,.2,1)}
.screen.on{display:block}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red);background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);padding:5px 10px;border-radius:999px}
.kicker.gold{color:var(--gold);background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.3)}
h1,h2{font-family:"Bricolage Grotesque",Inter,sans-serif;letter-spacing:-.01em;line-height:1.12}
h1{font-size:30px;font-weight:800;margin:14px 0 10px}
h2{font-size:23px;font-weight:800;margin:12px 0 8px}
.hl{color:var(--red)}
.u{text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}
.sub{color:var(--mute);font-size:15px}
.center{text-align:center}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);font-weight:600;margin-bottom:2px}
.qmeta b{color:var(--gold)}

/* options */
.opts{display:grid;gap:10px;margin-top:18px}
.opt{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;border-radius:var(--r);background:linear-gradient(180deg,rgba(239,68,68,.09),rgba(239,68,68,.04));border:1.5px solid rgba(239,68,68,.28);font-size:15px;font-weight:600;transition:transform .12s,border-color .2s,background .2s;overflow:hidden}
.opt:hover{border-color:rgba(239,68,68,.6)}
.opt:active{transform:scale(.98)}
.opt .em{font-size:22px;flex:none;width:30px;text-align:center}
.opt .tx{flex:1}
.opt .xpb{flex:none;font-size:11px;font-weight:800;color:var(--gold);opacity:.75}
.opt.pick{border-color:var(--red);background:rgba(239,68,68,.22);animation:pickPop .35s}
.opt.pick .xpb{opacity:1}
.opt.fade{opacity:.35}
.opt::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);transform:skewX(-20deg)}
.opt.pick::after{animation:shine .6s}
.opts.yn{grid-template-columns:1fr 1fr}
.opts.yn .opt{justify-content:center;font-size:17px;padding:18px}

/* image grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.card-opt{border-radius:var(--r);overflow:hidden;background:var(--card);border:1.5px solid var(--line);text-align:left;transition:.2s}
.card-opt .ph{aspect-ratio:1/1;position:relative;background:radial-gradient(circle at 50% 40%,#2a1515,#120c0c);display:grid;place-items:center;font-size:44px}
.card-opt .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card-opt .cap{padding:10px 11px 12px;font-size:13px;font-weight:600;line-height:1.3}
.card-opt.pick{border-color:var(--red);box-shadow:0 0 0 3px var(--redglow);animation:pickPop .35s}
.card-opt.fade{opacity:.35}

/* buttons */
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:18px 18px;border-radius:14px;font-weight:900;font-size:16px;letter-spacing:.01em;text-transform:uppercase;color:#fff;text-decoration:none;text-align:center;
  background:linear-gradient(180deg,var(--green) 0%,var(--green2) 55%,var(--green3) 100%);box-shadow:0 6px 0 #14532d,0 12px 30px rgba(34,197,94,.3);transition:transform .1s,box-shadow .1s;margin-top:18px;position:relative;overflow:hidden}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #14532d,0 6px 16px rgba(34,197,94,.3)}
.cta.pulse{animation:ctaPulse 1.8s infinite}
.cta.red{background:linear-gradient(180deg,#f87171,var(--red) 50%,var(--red2));box-shadow:0 6px 0 #7f1d1d,0 12px 30px rgba(239,68,68,.3)}
.cta::after{content:"";position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-20deg);animation:shine 2.8s infinite}
.safe{display:flex;gap:8px;align-items:flex-start;justify-content:center;margin-top:16px;font-size:12px;color:var(--green);text-align:center}

/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:16px}
.panel.glow{border-color:rgba(239,68,68,.4);box-shadow:0 0 40px rgba(239,68,68,.12)}
.panel.gold{border-color:rgba(251,191,36,.35);box-shadow:0 0 40px rgba(251,191,36,.08)}
.panel p+p{margin-top:10px}
.panel p{font-size:15px;color:#e4e4e7}

/* intro hero */
.hero-badge{width:96px;height:96px;margin:16px auto 0;border-radius:28px;display:grid;place-items:center;font-size:46px;background:radial-gradient(circle at 30% 25%,#f87171,#991b1b);box-shadow:0 0 0 6px rgba(239,68,68,.12),0 0 60px rgba(239,68,68,.45);animation:float 3s ease-in-out infinite}
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.perk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:11px;color:var(--mute);font-weight:600}
.perk b{display:block;font-size:20px;margin-bottom:2px}

/* analyzing */
.ring{width:170px;height:170px;margin:18px auto 10px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Bricolage Grotesque",sans-serif;font-size:42px;font-weight:800}
.checks{display:grid;gap:10px;margin-top:18px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--dim);transition:.3s}
.check .bx{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none;transition:.3s}
.check.ok{color:var(--txt)}
.check.ok .bx{background:var(--green);border-color:var(--green)}
.check.run .bx{border-color:var(--red);border-top-color:transparent;animation:spin .8s linear infinite}
.counter{margin-top:22px;text-align:center;font-size:14px;color:var(--mute)}
.counter b{color:var(--txt);font-size:18px}

/* result */
.gauge{position:relative;width:240px;height:140px;margin:14px auto 0}
.gauge .num{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:"Bricolage Grotesque",sans-serif;font-size:50px;font-weight:800;line-height:1}
.gauge .num small{font-size:22px}
.gauge .lab{position:absolute;left:0;right:0;bottom:-16px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
.profile{display:flex;gap:14px;align-items:center}
.profile .av{width:58px;height:58px;border-radius:16px;flex:none;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,#3f1d1d,#1c1010);border:1px solid rgba(239,68,68,.4)}
.profile .t small{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--red);text-transform:uppercase}
.profile .t div{font-family:"Bricolage Grotesque",sans-serif;font-size:21px;font-weight:800;line-height:1.1}
.stats{display:grid;gap:10px;margin-top:14px}
.stat .row{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:5px}
.stat .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.stat .bar i{display:block;height:100%;width:0;border-radius:99px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.expert{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.expert .ph{width:56px;height:56px;border-radius:50%;overflow:hidden;flex:none;background:linear-gradient(135deg,#ef4444,#7f1d1d);display:grid;place-items:center;font-size:24px;border:2px solid var(--red);position:relative}
.expert .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.expert b{display:block;font-size:15px}
.expert span{font-size:12px;color:var(--mute)}

/* testimonials carousel */
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin:14px -16px 0;padding-left:16px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car .sl{flex:0 0 78%;scroll-snap-align:center;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);min-height:240px;position:relative;display:grid;place-items:center}
.car .sl img{width:100%;height:auto}
.car .sl .miss{padding:20px;text-align:center;color:var(--dim);font-size:13px}
.car .sl .miss b{display:block;font-size:30px;margin-bottom:6px}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:6px;height:6px;border-radius:9px;background:var(--line);transition:.3s}
.dots i.on{width:18px;background:var(--red)}

/* chest */
.chest-wrap{text-align:center;margin-top:16px}
.chest{font-size:110px;line-height:1;display:inline-block;filter:drop-shadow(0 0 30px rgba(251,191,36,.45));transition:transform .15s;user-select:none}
.chest.shake{animation:shake .45s}
.chest.open{animation:openChest .6s forwards}
.taps{display:flex;justify-content:center;gap:8px;margin-top:14px}
.taps i{width:38px;height:6px;border-radius:9px;background:var(--line);transition:.3s}
.taps i.on{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.loot{display:grid;gap:10px;margin-top:18px}
.lootc{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:linear-gradient(90deg,rgba(251,191,36,.1),rgba(251,191,36,.02));border:1px solid rgba(251,191,36,.3);text-align:left;opacity:0;transform:translateY(14px) scale(.96);transition:.45s cubic-bezier(.2,.8,.2,1)}
.lootc.show{opacity:1;transform:none}
.lootc .ic{width:52px;height:65px;border-radius:12px;flex:none;background:#1f1a0e;display:grid;place-items:center;font-size:26px;overflow:hidden;position:relative}
.lootc .ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.lootc b{display:block;font-size:14px;line-height:1.25}
.lootc s{color:var(--dim);font-size:12px}
.lootc em{font-style:normal;color:var(--green);font-weight:800;font-size:12px;margin-left:4px}
.total{margin-top:16px;font-size:14px;color:var(--mute);text-align:center}
.total b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:40px;color:var(--gold);line-height:1.1}

/* offer */
.video{aspect-ratio:9/16;max-height:520px;width:100%;border-radius:var(--r);overflow:hidden;background:#000;border:1px solid var(--line);display:grid;place-items:center;margin-top:14px;position:relative}
.video .ph{text-align:center;color:var(--dim);font-size:13px}
.video .ph b{display:grid;place-items:center;width:70px;height:70px;border-radius:50%;background:var(--red);color:#fff;font-size:26px;margin:0 auto 10px;box-shadow:0 0 0 10px rgba(239,68,68,.15)}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.tl{position:relative;margin-top:6px;padding-left:28px}
.tl::before{content:"";position:absolute;left:10px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--red),var(--green))}
.tli{position:relative;padding:8px 0}
.tli::before{content:"";position:absolute;left:-23px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--red)}
.tli:last-child::before{border-color:var(--green);background:var(--green)}
.tli b{font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
.tli p{font-size:14px;margin-top:2px}
.list{list-style:none;display:grid;gap:9px;margin-top:10px}
.list li{display:flex;gap:10px;font-size:14px;align-items:flex-start}
.list li::before{content:"✓";flex:none;width:20px;height:20px;border-radius:50%;background:rgba(34,197,94,.15);color:var(--green);font-weight:900;font-size:12px;display:grid;place-items:center;margin-top:1px}
.bonus{display:flex;gap:12px;padding:14px 0;border-top:1px dashed var(--line)}
.bonus:first-of-type{border-top:0}
.bonus .ic{width:64px;height:80px;border-radius:12px;flex:none;background:#1f1a0e;display:grid;place-items:center;font-size:28px;overflow:hidden;position:relative;border:1px solid rgba(251,191,36,.3)}
.bonus .ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bonus .tag{display:inline-block;font-size:10px;font-weight:900;letter-spacing:.08em;color:#111;background:var(--gold);padding:2px 7px;border-radius:5px;margin-bottom:4px}
.bonus b{display:block;font-size:15px;line-height:1.25}
.bonus .pr{font-size:12px;color:var(--dim);margin:2px 0 4px}
.bonus .pr em{font-style:normal;color:var(--green);font-weight:800}
.bonus p{font-size:13px;color:var(--mute)}
.price{text-align:center;padding:22px 18px;border-radius:20px;margin-top:16px;background:linear-gradient(180deg,#14140f,#0e0e10);border:2px solid var(--green);box-shadow:0 0 50px rgba(34,197,94,.15);position:relative}
.price .rib{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--green);color:#052e16;font-size:11px;font-weight:900;letter-spacing:.08em;padding:5px 12px;border-radius:999px;white-space:nowrap}
.price .old{color:var(--dim);text-decoration:line-through;font-size:18px;font-weight:700}
.price .new{font-family:"Bricolage Grotesque",sans-serif;font-size:58px;font-weight:800;line-height:1;margin:4px 0;color:var(--green)}
.price .what{font-weight:700;font-size:15px}
.price .once{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.05em;margin-top:6px}
.guar{display:flex;gap:14px;align-items:center}
.guar .seal{width:74px;height:74px;flex:none;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:900;font-size:11px;line-height:1.1;color:#111;background:radial-gradient(circle,var(--gold),var(--gold2));box-shadow:0 0 0 4px rgba(251,191,36,.2)}
.guar .seal b{display:block;font-size:24px}
.faq{border-top:1px solid var(--line)}
.faq:first-of-type{border-top:0}
.faq button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:14px 0;font-weight:700;font-size:14px;gap:10px}
.faq button span{color:var(--red);transition:.25s;flex:none}
.faq.open button span{transform:rotate(45deg)}
.faq .a{max-height:0;overflow:hidden;transition:max-height .35s;font-size:14px;color:var(--mute)}
.faq.open .a{max-height:200px;padding-bottom:14px}
.for{display:grid;gap:10px;margin-top:10px}
.for div{padding:12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:13px;color:var(--mute)}
.for b{display:block;color:var(--txt);font-size:14px;margin-bottom:2px}
.badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.badges span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);color:var(--gold)}
.foot{margin-top:28px;text-align:center;font-size:11px;color:var(--dim)}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);transform:translateY(110%);visibility:hidden;transition:transform .35s,visibility .35s}
.sticky.show{transform:none;visibility:visible}
.sticky .cta{max-width:448px;margin:0 auto;padding:15px;font-size:14px}

/* toasts & fx */
.toast{position:fixed;left:50%;top:14px;z-index:60;transform:translate(-50%,-140%);display:flex;gap:10px;align-items:center;padding:10px 16px 10px 10px;border-radius:14px;background:#1a1408;border:1px solid var(--gold);box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 30px rgba(251,191,36,.25);transition:transform .45s cubic-bezier(.2,1.4,.4,1);max-width:92vw}
.toast.show{transform:translate(-50%,0)}
.toast .i{width:38px;height:38px;border-radius:10px;background:radial-gradient(circle,var(--gold),var(--gold2));display:grid;place-items:center;font-size:20px;flex:none}
.toast small{display:block;font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
.toast b{font-size:14px}
.float-xp{position:fixed;z-index:55;pointer-events:none;font-weight:900;color:var(--gold);font-size:18px;text-shadow:0 0 12px rgba(251,191,36,.7);animation:floatUp 1s forwards}
.lvl{position:fixed;inset:0;z-index:58;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .25s}
.lvl.show{opacity:1}
.lvl div{text-align:center;transform:scale(.6);transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
.lvl.show div{transform:scale(1)}
.lvl small{display:block;font-size:12px;font-weight:900;letter-spacing:.3em;color:var(--gold)}
.lvl b{font-family:"Bricolage Grotesque",sans-serif;font-size:64px;font-weight:800;text-shadow:0 0 40px rgba(239,68,68,.8)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:57}
.stretch{display:flex;align-items:center;gap:8px;margin:10px 0 2px;padding:9px 12px;border-radius:12px;background:linear-gradient(90deg,rgba(251,191,36,.14),rgba(251,191,36,.03));border:1px solid rgba(251,191,36,.35);font-size:13px;font-weight:800;color:var(--gold);animation:in .6s}

      if(level>=0&&MEL[bar][e]&&Math.floor(step/32)%2===1) piano(MEL[bar][e],t,.10,2.6);
      if(level>=2&&(e===0||e===4)) pulse(t,e===0?.2:.12);
      if(level>=3&&e%2===1) shimmer(t);
      step++; next+=EIGHTH;
    }
  }
  return {
    start(){
      if(on)return; on=true;
      if(CONFIG.musicUrl){audioEl=audioEl||new Audio(CONFIG.musicUrl);audioEl.loop=true;audioEl.volume=CONFIG.musicVolume;audioEl.play().catch(()=>{});return}
      try{ if(!ctx)setup(); ctx.resume&&ctx.resume(); next=ctx.currentTime+.1;
        master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setValueAtTime(master.gain.value,ctx.currentTime);master.gain.linearRampToValueAtTime(CONFIG.musicVolume,ctx.currentTime+3);
        timer=setInterval(schedule,100);schedule();
      }catch(e){}
    },
    stop(){
      if(!on)return; on=false;
      if(audioEl){audioEl.pause();return}
      try{master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setValueAtTime(master.gain.value,ctx.currentTime);master.gain.linearRampToValueAtTime(0,ctx.currentTime+.8);setTimeout(()=>{if(!on)clearInterval(timer)},900)}catch(e){}
    },
    setLevel(l){level=l},
    _render(c,secs,lv){ctx=c;master=ctx.createGain();master.gain.value=CONFIG.musicVolume;master.connect(ctx.destination);rev=ctx.createConvolver();rev.buffer=impulse(4.2);const rg=ctx.createGain();rg.gain.value=.55;rev.connect(rg);rg.connect(master);step=0;next=0;const seg=secs/lv.length;lv.forEach((L,i)=>{level=L;schedule((i+1)*seg)})},
    duck(v=.35,ms=1200){ if(!on||!master||audioEl)return; const t=ctx.currentTime;master.gain.cancelScheduledValues(t);master.gain.setValueAtTime(master.gain.value,t);master.gain.linearRampToValueAtTime(CONFIG.musicVolume*v,t+.08);master.gain.linearRampToValueAtTime(CONFIG.musicVolume,t+ms/1000)}
  };
})();

const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],raf;
function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
addEventListener('resize',resize);resize();
function confetti(n=90,x=innerWidth/2,y=innerHeight/3,colors=['#ef4444','#fbbf24','#22c55e','#fff']){
  for(let k=0;k<n;k++)parts.push({x,y,vx:(Math.random()-.5)*12,vy:Math.random()*-12-3,s:Math.random()*6+3,c:colors[k%colors.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:120});
  if(!raf)loop();
}
function loop(){
  cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life-->0);
  parts.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.life/40);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});
  raf=parts.length?requestAnimationFrame(loop):(cx.clearRect(0,0,innerWidth,innerHeight),null);
}

  n.querySelector('#chGo').onclick=next;
  return n;
},

function testimonialsBlock(title,auto){
  const list=CONFIG.testimonials||[];if(!list.length)return '';
  return `<div class="tst" data-auto="${auto?1:0}" style="display:none;margin-top:18px">
    ${title?`<h2 style="font-size:19px;text-align:center">${title}</h2>`:''}
    <div class="car">${list.map((src,k)=>`<div class="sl" data-n="${k+1}" style="min-height:0;display:none"><img src="${encodeURI(src)}" alt=""></div>`).join('')}</div>
    <div class="dots"></div>
  </div>`;
}
function wireTestimonials(root){
  root.querySelectorAll('.tst').forEach(box=>{
    const car=box.querySelector('.car'),dots=box.querySelector('.dots');
    const refresh=()=>{const vis=[...car.children].filter(c=>c.style.display!=='none');box.style.display=vis.length?'block':'none';dots.innerHTML=vis.length>1?vis.map((_,k)=>`<i class="${k?'':'on'}"></i>`).join(''):''};
    car.querySelectorAll('img').forEach(im=>{im.onload=()=>{im.parentNode.style.display='grid';refresh()};im.onerror=()=>{const sl=im.parentNode;
      if(CONFIG.testimonialPlaceholders){sl.innerHTML=`<div class="miss" style="padding:24px;text-align:center;color:var(--dim);font-size:13px;border:2px dashed var(--line);border-radius:12px;margin:10px;min-height:220px;display:grid;place-items:center"><div><b style="display:block;font-size:30px;margin-bottom:6px">📱</b>Depoimento ${sl.dataset.n}<br><small>images/depoimentos/depoimento-${sl.dataset.n}.webp</small></div></div>`;sl.style.display='block';refresh()}else sl.remove()}});
    if(box.dataset.auto==='1'){let i=0;const iv=setInterval(()=>{if(!document.body.contains(box)){clearInterval(iv);return}const vis=[...car.children].filter(c=>c.style.display!=='none');if(vis.length<2)return;i=(i+1)%vis.length;car.scrollTo({left:vis[i].offsetLeft-car.offsetLeft-16,behavior:'smooth'})},1400)}
    car.addEventListener('scroll',()=>{const f=[...car.children].find(c=>c.style.display!=='none');if(!f)return;const k=Math.round(car.scrollLeft/(f.offsetWidth+12));dots.querySelectorAll('i').forEach((d,j)=>d.classList.toggle('on',j===k))});
  });
}
function wireCheckout(root){root.querySelectorAll('[data-checkout]').forEach(a=>{a.href=checkoutHref();a.target='_top';a.onclick=()=>track('checkout')})}

  const base=[91,88,83,77][t];
  const adj=[0,-4,-2,-1,3][m];
  const score=Math.max(70,Math.min(94,base+adj));
  const P=[
    {icon:"🌪️",name:"El Desgastado",text:"La relación no terminó por falta de amor, sino por desgaste. Eso es bueno: el sentimiento sigue ahí, solo está cubierto por las peleas. Tu protocolo empieza limpiando esa imagen negativa."},
    {icon:"🔥",name:"El Arrepentido",text:"Cometiste un error, y ella está protegiéndose. Insistir con disculpas solo refuerza el dolor. Tu protocolo usa la Disculpa Invisible para reconstruir la confianza sin presión."},
    {icon:"🧊",name:"El Apagón Emocional",text:"Cuando ella dice que 'ya no siente lo mismo', su lado emocional está apagado, no muerto. Tu protocolo se enfoca en reactivar esa chispa con los estímulos correctos."},
    {icon:"🌫️",name:"El Desconcertado",text:"No saber por qué se fue es lo que más duele. Tu protocolo empieza revelando las señales que ella dejó y lo que realmente pasó en su mente."},
    {icon:"🔙",name:"El Que Soltó",text:"Fuiste tú quien terminó, y eso te da una ventaja: ella todavía guarda la herida del rechazo, lo que significa que aún le importas. Tu protocolo te muestra cómo volver sin parecer inseguro."},
  ][m];
  const tt=["Menos de una semana: la ventana está totalmente abierta.","Entre 1 y 4 semanas: el momento ideal para actuar.","Entre 1 y 3 meses: todavía hay memoria emocional fuerte, pero hay que actuar ya.","Más de 3 meses: el camino es más largo, pero tu protocolo está ajustado para eso."][t];
  return {...P,score,text:P.text+' <br><br><b>⏱️ '+tt+'</b>',s1:Math.min(95,score-6+(m===4?6:0)),s2:[94,82,64,48][t]};
}
